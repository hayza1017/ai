<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    <p>순서가 없는 목록 태그(unorder list)</p>
    <ul typeof="circle">
        <!--circle, disc, square-->
        <li>MENU1</li>
        <li>MENU2</li>
        <li>List item</li>
    </ul>

    <p>순서가 있는 목록 태그(order list)</p>
    <ol type="i">
        <!--1,a,A,i,I-->
        <li>MENU1</li>
        <li>MENU2</li>
        <li>List item</li>
    </ol>

</body>
</html>
