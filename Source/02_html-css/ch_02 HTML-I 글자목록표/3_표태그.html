<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        table{
            background-color:#000000; /*검정*/
            margin: 10px 20px; /*밖여백 : 윗여백, 오른쪽여백, 아랫쪽여백, 왼쪽여백*/
        }
        tr{background-color:#FFFFFF; /*흰색*/}
        td{
            padding:5px 10px; /*안여백 :  위 오른쪽 아래 왼쪽 여백*/
            text-align:center; /*글씨 가운데 정렬*/
        }
    </style>
</head>
<body>
    <table>
        <caption>기본테이블(병합X)</caption>
        <tr>
            <td>1행 1열</td>
            <td>1행 2열</td>
            <td>1행 3열</td>
            <td>1행 4열</td>
        </tr>
        <tr>
            <td>2행 1열</td>
            <td>2행 2열</td>
            <td>2행 3열</td>
            <td>2행 4열</td>
        </tr>
        <tr>
            <td>3행 1열</td>
            <td>3행 2열</td>
            <td>3행 3열</td>
            <td>3행 4열</td>
        </tr>
    </table>
    <table>
        <caption>기본테이블(열병합, 행병합)</caption>
        <tr>
            <td>1행 1열</td>
            <th colspan="3">1행 2,3,4열</th>
        </tr>
        <tr>
            <td>2행 1열</td>
            <td>2행 2열</td>
            <td rowspan="2">2행 3열</td>
            <td>2행 4열</td>
        </tr>
        <tr>
            <td>3행 1열</td>
            <td>3행 2열</td>
            <td>3행 4열</td>
        </tr>
    </table>
</body>
</html>
