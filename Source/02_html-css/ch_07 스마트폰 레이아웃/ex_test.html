<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0,
    maximun-scal_2.0, maximun-scal=0.7, user-scalable=yes" />
    <title></title>
    <style>
        /* body{touch-action: none;} 확대 금지 */
        /***페이지 초기화***/
        *{
            margin: 0; padding: 0;
        }
        body{background-color: rgb(106, 178, 105);}
        #showHide{
            width: 200px; height: 100px;
            background-color: blanchedalmond;
            display: none;
        }
        #toggle:checked ~ #showHide{display: block;}
        #toggle{display: none;}
    </style>
</head>
<body>
    <input type="checkbox" id="toggle">
    <p>중간에 내용이 많아도 상관없음.</p>
    <label for="toggle">
        <img src="ch07/menu.png" alt="MENU">
    </label>
    <p>중간에 내용을 많이 넣어도 상관 없음</p>
    <div id="showHide">토글부분(메뉴가 나타났다 사라졌다가 나타났다가....)</div>
</body>
</html>
