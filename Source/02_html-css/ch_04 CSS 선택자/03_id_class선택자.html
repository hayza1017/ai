<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        div{border: 1px solid gray;}
        #header, #footer{/*id선택자(#id)*/
        width:600px;
        margin:0 auto;
        background-color: cornflowerblue;
        text-align: center;
        /*text-decoration:underline; 밑줄*/
        }
        #wrap{
            width: 600px;
            margin: 0 auto;
            background-color: aliceblue;
            overflow: hidden; /*부모단에*/
            text-align: center; /*가운데 정렬(라인형)*/
        }
        #wrap #content{
            float: left;/*블록형태그를 수평으로 250*/
            width: 248px;/*content가로 =width(348px) + border(1px*2) = 350*/
            height: 300px;
        }
        #wrap #content .odd {/*class선택자(.)*/
            font-size: 1.5em; /*원래 크기의 1.5배*/
        }
        #wrap #content .menu2{font-weight: bold;}
        #wrap #side_banner {
            float: left; /*블록형태그를 수평으로 350*/
            width: 348px; /*가로 = width(248px) + border(1px*2) = 250*/
            height: 300px;
        }
        #wrap #side_banner img{width: 250px;}
        #footer{
            clear: both;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>HEADER</h1>
    </div>
    <div id="wrap">
        <div id="content">
            <h2>CONTENT</h2>
            <ul>
                <li class="menu1 odd">menu1</li>
                <li class="menu2">menu2</li>
                <li class="menu3 odd">menu3</li>
                <li class="menu4">menu4</li>
                <li class="menu5 odd">menu5</li>
            </ul>
        </div>
        <div id="side_banner">
            <h2>BANNER</h2>
            <a href="=http://google.com">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Google_2015_logo.svg/500px-Google_2015_logo.svg.png"
                     alt="다음로고" />
            </a>
        </div>
    </div>
    
    <div id="footer">
        <h1>FOOTER</h1>
    </div>
</body>
</html>
