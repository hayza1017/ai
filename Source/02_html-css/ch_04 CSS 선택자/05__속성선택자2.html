<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        div#wrap{
            width: 350px; margin:0 auto; /*가운데 배치*/
        }
        header {
            color: orange;
            text-align: center;
        }
        section {
            border-top: 1px solid gray;
            border-bottom: 1px solid gray;
        }
        section h4[title^='남자']{
            background: url('ch04/man.png') no-repeat;
            padding: 0 0 0 30px; /*안여백 위우하좌*/
        }
        section h4[title^='여자']{
           background: url('ch04/woman.png') no-repeat;
           padding: 0 0 0 30px; /*안여백 위우하좌*/
        }
        section p {text-align:center;}
        section a{
            text-decoration:none; /*밑줄 없앰*/
            color:navy;
        }
        section a[href$='.docx'], section a[href$='.doc']{
            background: url(ch04/word.png) no-repeat right;
            padding: 0 30px 0 0;
        }
        
        section a[href$='.xlsx'], section a[href$='.xls']{
            background: url(ch04/excel.png) no-repeat right;
            padding-right: 30px;
        }
        footer{
            text-align:center; color: #8e8d8d;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <header>
            <h1>객실 안내</h1>
        </header>
        <section>
            <h4 title="남자 도리도리">남자 도리도리</h4>
            <ul>
                <li>공동취사시설 및 욕실 사용</li>
                <li>1인 20,000원(비수기), 25,000(성수기)</li>
            </ul>
            <h4 title="여자 도리도리">여자 도리도리</h4>
            <ul>
                <li>취사 기구 완비 실내 욕실 사용</li>
                <li>1인 30,000원</li>
            </ul>
            <p><a href="ch04/intro.docx">유의사상 다운로드</a></p>
            <p><a href="ch04/intro.xlsx">객실자료 다운로드</a></p>
        </section>
        <footer>
            <p>서울시 무슨구 궁금로</p>
        </footer>
    </div>
</body>
</html>
