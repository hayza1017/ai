<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        input{ color: green; }
        input[type='password']{/*type이 password인 속성*/
            color: black;
        }
        input[type^= 'te']{/*type이 te로 시작하는 태그*/
            width: 100px; color: orange;
        }
        input[name$='me']{/*name속성이 me로 끝나는 태그*/
            border: 1px solid red;
            padding: 10px;
            outline: 0; /*input태그가 focus되었을때 나타는 border*/
        }
        img[alt]{width: 50px; border: 2px solid red;} /*img태그 중 alt속성이 있는 태그*/
    </style>
</head>
<body>
    <form>
        이름<input type="text" name="name" /><br />
        ID<input type="text" name="id" /><br />
        PW<input type="password" name="pw" /><br />
        전화<input type="tel" name="tel" /><br />
        <img src="ch04/sulhyun.jpg" />
        <img src="ch04/sulhyun.jpg" alt="설현" />
        <input type="submit" />
    </form>
</body>
</html>
