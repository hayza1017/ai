<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        input:focus {
            background-color: lightskyblue;
            border: 2px solid blue;
            outline: none;
        }
        input:enabled{/*focus 가능*/
            color: darkblue;

        }
        input:disabled{/*focus 불가능*/
            color:black;
        }
        input:read-only{/*readonly이거나 disabled*/
            color:orange;
        }
    </style>
</head>
<body>
    <form>
        이름<input type="text" name="name" /><br />
        아디<input type="text" name="id" /><br />
        시급<input type="text" name="sal" value="11000" disabled="disabled" /><br />
        생일<input type="text" name="birth" value="981212" readonly="readonly"/><br />
        <input type="submit" />
    </form>
</body>
</html>
