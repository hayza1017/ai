<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        span {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <h1>회원가입</h1>
    </header>
    <div id="join_content">
        <form name="frm" onsubmit="return chk()">
            <fieldset>
                <legend>필수입력</legend>
                <table>
                    <tr>
                        <td>이름<span>*</span></td>
                        <td>
                            <input type="text" name="uname" placeholder="이름은 2글자 이상" />
                            <br />
                        </td>
                    </tr>

                    <tr>
                        <td>아이디<span>*</span></td>
                        <td>
                            <input type="text" name="id" placeholder="ID는 4글자 이상" />
                            <br />
                        </td>
                    </tr>

                    <tr>
                        <td>비밀번호<span>*</span></td>
                        <td>
                            <input type="text" name="upw" />
                            <br />
                        </td>
                    </tr>

                    <tr>
                        <td>비번확인<span>*</span></td>
                        <td>
                            <input type="text" name="upwChk" />
                            <br />
                        </td>
                    </tr>

                    <tr>
                        <td>전화번호<span>*</span></td>
                        <td>
                            <input type="tel" name="tel" placeholder="xx-xxx-xxxx/000-0000-0000" />
                            <br />
                        </td>
                    </tr>

                    <tr>
                        <td>이메일<span>*</span></td>
                        <td>
                            <input type="email" name="email" placeholder="xl@domain.com또는 co.kr" />
                            <br />
                        </td>
                    </tr>
            </fieldset>
            <fieldset>
                <legend>추가 입력 사항</legend>
                <form>
                    결혼유무
                    <input type="radio" name="gender" value="m" />기혼
                    <input type="radio" name="gender" value="f" />미혼
                    </br>
                    자식<input type="checkbox" name="lang" value="s" checked="checked" />아들
                    <input type="checkbox" name="lang" value="d" />딸
                    <br />
                    지역
                    <select name="nation">
                        <option>경기</option>
                        <option>인천</option>
                        <option>충주</option>
                        <option>대구</option>
                    </select><br />
                </form>
            </fieldset>
            <p>
                <input type="submit" value="가입" />
                <input type="submit" value="취소" />
            </p>
        </form>
    </div>
    <hr />
    <footer>
        <p>서울시 마포구 태해란로 345, 555 (신림동, 우장빌딩) | 좋은 느낌(주) 고길동</p>
        <p>Copyright ⓒ Joeun System corp. all right</p>
    </footer>
</body>
</html>
