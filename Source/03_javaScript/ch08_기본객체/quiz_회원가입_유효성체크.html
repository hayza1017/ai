<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    <style>
    table {width:350px; margin:20px auto; padding:20px 10px;}
    table, input[type='text'], input[type='password'] {
        border: 1px solid #385d81;
        outline: 1px solid #385d81;
        padding: 2px;
    }
    input[type='submit'], input[type='reset'], input[type='button'], button{
        background-color: #385d81;
        border:0; outline:0;
        color:white; 
        border-radius: 3px;
        padding:10px 20px;
        margin:5px;
    }
    td, th { padding:5px 10px; text-align:center;}
    </style>

    <script>
        const joinCheck = () => {
            //패턴들(숫자, 알파벳, 특수문자), 이메일정규표현식패턴, [이름정규표현식패턴]
            var patternName = /[~`!@#$%^&*()_\-+=\|\\\[\]{}'":;?\/<>,\.0-9]/; //이름정규표현식 패턴
            var patternEmail = /[a-z0-9_\.]{3,}@\w+\.\w+(\.\w+)?\w[a-z0-9_]+@\w+(\.\w+){1,2}/; //이메일정규표현식패턴
            var patternPw = /[0-9a-zA-Z~`!@#$%^&*()_\-+=\|\\\[\]{}'":;?\/<>,\.]/; //숫자,알파벳,특수문자 패턴

            //입력상자에서 입력받은 내용을 변수
            name = frm.name.value.trim(); // html 3장 form태그 유효성검사
            mail = frm.mail.value.trim();
            pw = frm.pw.value.trim();
            pwchk = frm.pwChk.value.trim();
            // 유효한 데이터를 입력하지 않을 경우 return false부분
            if (patternName.test(name)) {
                alert('특수문자랑 숫자는 못옵니다.(2글자이상)');
                frm.name.value = "";
                frm.name.focus();
                return false;
            }
            else if (patternEmail.test(mail)) {
                alert('메일 형식에 맞춰주세요.');
                frm.mail.value = "";
                frm.mail.focus();
                return false;
            }

            return true;
        };
    </script>

</head>

<body>
    <form action="#" name="frm" onsubmit="return joinCheck()">
        <table>
            <tr>
                <th>이름</th>
                <td>
                    <input type="text" name="name" placeholder="특수문자와 숫자 못 와" autofocus="autofocus" />
                </td>
            </tr>
            <tr>
                <th>메일</th>
                <td><input type="text" name="mail" placeholder="메일 형식에 맞추세요" /></td>
            </tr>
            <tr>
                <th>비밀번호</th>
                <td><input type="password" name="pw" placeholder="특수문자,알파벳,숫자 포함" /></td>
            </tr>
            <tr>
                <th>비밀번호</th>
                <td><input type="password" name="pwChk" /></td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="submit" value="회원가입" />
                    <input type="reset" value="취소" />
                    <input type="button" value="로그인" />
                </td>
            </tr>
        </table>
    </form>

</body>

</html>
