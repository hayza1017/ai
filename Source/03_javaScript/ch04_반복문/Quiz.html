<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    <script>
        // 4개 선언(count, rightcount, wrongcount, sum)
        let count = 0;
        let rightcount = 0;
        let wrongcount = 0;
        let sum = 0;

        while(confirm('누적할래?')){
            // prompt로 점수 받기
            var su = prompt("점수를 입력하시오.");
            count++;
            score = Number(su);
            if( score>=0 && score<=100 ){
            sum += score;
            rightcount++;
            }else{
                wrongcount++;
            }
            // 수로 형변환


            // 제대로 입력했는지 여부에 따라 수행
            
        }
        document.write(`${count}번 입력 <br>`);
        document.write(`누적점수: ${sum}<br>`);
        document.write(`점수를 제대로 입력한 횟수: ${rightcount} <br>`);
        document.write(`점수를 잘못 입력한 횟수: ${wrongcount} <br>`);
    </script>
</head>
<body>
    
</body>
</html>
