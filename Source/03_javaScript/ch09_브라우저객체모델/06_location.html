<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <title></title>
    <script>
        var sec = 0;
        var timerId = setInterval(() => {
            sec++;
            document.body.innerHTML += `<h${sec}>${sec}초 지남</h${sec}>`;
        }, 1000);
        setTimeout(()=>{
            clearInterval(timerId); // 타이머 정지
            // 페이지 변경
            location.href = '07_history.html';
            // location = '07_history.html'
            // location.assign('07_history.html');
        }, 5000);
    </script>
</head>
<body>
    <h1>잠시후 페이지 이동이 있겠습니다</h1>
</body>
</html>
