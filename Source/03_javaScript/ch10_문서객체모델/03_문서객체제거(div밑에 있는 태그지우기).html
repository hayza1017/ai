<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <title></title>
    <script>
        var warp;
        window.onload = () => {
            // wrap = document.getElementById('wrap');//1빙법 
            // wrap = document.getElementsByTagName('div')[0]; ///qkdqjq 4
            wrap = document.querySelector('div#wrap'); ///방법 5
            // warp - document.querySelectorAll('div#warp')[0]//방법6
        }
        const append = () =>{
            //h1태그를 body에 생성
            var h1 = document.createElement('h1');
            var textNode = document.createTextNode('추가한 HEADER');
            h1.appendChild(textNode)
            warp.appendChild(h1);
        };
        const remove = () => {
            //h1태그 하나 제거하기
            // var h1 = document.getElementsByTagName('h1'); // 배열(없으면 빈배열)
            // var h1 = document.querySelector('h1'); // 엘리먼트 하나(없으면 null)
            var h1 = document.querySelectorAll('h1'); // 배열(없으면 null)
            if(h1.length>0){
                wrap.removeChild(h1[0]);
            }else{
                alert('지울 h1태그가 없습니다.')
            }
        };
    </script>
</head>
<body>
    <div id="warp">
        <input type="button" value="태그 추가하기" onclick="append()">
        <button onclick="remove();">태그제거하기</button>
        <h1>HEADER</h1>
        <h1>HEADER</h1>
    </div>

</body>
</html>
